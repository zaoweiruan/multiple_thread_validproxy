<svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <!-- 悬浮阴影滤镜 -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 浅绿色圆形悬浮容器 -->
  <circle cx="90" cy="90" r="80" fill="#bbf7d0" fill-opacity="0.9" stroke="#22c55e" stroke-width="2" filter="url(#shadow)"/>

  <!-- 运行状态指示灯 -->
  <circle id="statusDot" cx="90" cy="90" r="12" fill="#22c55e">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>