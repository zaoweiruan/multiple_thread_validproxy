<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" fill="none" role="img" aria-label="正在运行的代理进程">
  <title>代理进程悬浮球</title>
  <desc>圆形悬浮框，浅绿色填充，展示当前正在运行的代理进程，含运行态动效</desc>

  <defs>
    <!-- 悬浮球浅绿色填充 -->
    <radialGradient id="bubbleBg" cx="35%" cy="27%" r="88%">
      <stop offset="0" stop-color="#FAFFFC"/>
      <stop offset="48%" stop-color="#D8F8E8"/>
      <stop offset="100%" stop-color="#A6EACB"/>
    </radialGradient>

    <!-- 深绿：用于浅底之上的所有图形元素，保证对比度 -->
    <linearGradient id="brandGreen" x1="14" y1="14" x2="106" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#17C07C"/>
      <stop offset="55%" stop-color="#0E9E62"/>
      <stop offset="100%" stop-color="#076B41"/>
    </linearGradient>

    <!-- 运行进度弧渐变（头部亮、尾部淡） -->
    <linearGradient id="arcGreen" x1="60" y1="18" x2="102" y2="102" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0E9E62" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#065F3A"/>
    </linearGradient>

    <!-- 主节点到子进程节点的连线渐变 -->
    <linearGradient id="linkGreen" x1="60" y1="60" x2="60" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0E9E62" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#076B41" stop-opacity="0.95"/>
    </linearGradient>

    <filter id="floatShadow" x="-45%" y="-45%" width="190%" height="190%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0A5C39" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- 活跃脉冲：向外扩散的光环 -->
  <g fill="none" stroke="#17C07C" stroke-width="2">
    <circle cx="60" cy="60" r="42" opacity="0">
      <animate attributeName="r" values="41;58" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="60" r="42" opacity="0">
      <animate attributeName="r" values="41;58" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 悬浮球主体（浅绿填充） -->
  <g filter="url(#floatShadow)">
    <circle cx="60" cy="60" r="42" fill="url(#bubbleBg)"/>
  </g>

  <!-- 轨道底环 + 运行进度弧 -->
  <circle cx="60" cy="60" r="42" stroke="#0E9E62" stroke-opacity="0.2" stroke-width="3"/>
  <circle cx="60" cy="60" r="42" stroke="url(#arcGreen)" stroke-width="3" stroke-linecap="round"
          stroke-dasharray="76 188">
    <animateTransform attributeName="transform" attributeType="XML" type="rotate"
                      from="0 60 60" to="360 60 60" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <!-- 顶部高光（浅底上的玻璃感） -->
  <path d="M23.4 46.7 A39 39 0 0 1 96.6 46.7" stroke="#FFFFFF" stroke-opacity="0.75"
        stroke-width="2.5" stroke-linecap="round"/>

  <!-- 内侧虚线环，缓慢反向旋转 -->
  <circle cx="60" cy="60" r="31" stroke="#0E9E62" stroke-opacity="0.28" stroke-width="1"
          stroke-dasharray="2 6">
    <animateTransform attributeName="transform" attributeType="XML" type="rotate"
                      from="360 60 60" to="0 60 60" dur="30s" repeatCount="indefinite"/>
  </circle>

  <!-- 代理进程拓扑：主节点 + 3 个子进程节点 -->
  <g>
    <animateTransform attributeName="transform" attributeType="XML" type="rotate"
                      from="0 60 60" to="360 60 60" dur="16s" repeatCount="indefinite"/>
    <g stroke="url(#linkGreen)" stroke-width="2" stroke-linecap="round">
      <line x1="60" y1="60" x2="60" y2="40"/>
      <line x1="60" y1="60" x2="60" y2="40" transform="rotate(120 60 60)"/>
      <line x1="60" y1="60" x2="60" y2="40" transform="rotate(240 60 60)"/>
    </g>
    <g fill="url(#brandGreen)">
      <circle cx="60" cy="40" r="4.6"/>
      <circle cx="60" cy="40" r="4.6" transform="rotate(120 60 60)"/>
      <circle cx="60" cy="40" r="4.6" transform="rotate(240 60 60)"/>
    </g>
  </g>

  <!-- 主节点 + 心跳脉冲 -->
  <circle cx="60" cy="60" r="9.5" fill="none" stroke="#0E9E62" stroke-width="2" opacity="0.6">
    <animate attributeName="r" values="9.5;21" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="60" r="9.5" fill="#FFFFFF" stroke="url(#brandGreen)" stroke-width="2.5"/>
  <circle cx="60" cy="60" r="3.4" fill="url(#brandGreen)"/>

  <!-- 角标：运行中的进程数 -->
  <g>
    <circle cx="95" cy="27" r="13.5" fill="#05603A" stroke="#FFFFFF" stroke-width="2.5"/>
    <text x="95" y="27" dy="0.36em" text-anchor="middle" font-size="14" font-weight="700"
          fill="#FFFFFF" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">3</text>
  </g>
</svg>
